server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Photos are up to 5 MB (see backend/app/core/uploads.py).
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/(api|auth|uploads|health)(/|$) {
        proxy_pass http://backend:8002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so browsers may keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router: unknown paths load the app, which shows its own 404 page.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
