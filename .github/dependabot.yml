# Weekly update PRs for the v3 code. They target the v3 branch until v3 is merged into master.
version: 2
updates:
  - package-ecosystem: uv
    directory: /api
    target-branch: v3
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    target-branch: v3
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: v3
    schedule:
      interval: monthly
