[project]
name = "conferencehub-api"
version = "3.0.0a0"
description = "ConferenceHub v3 API: async FastAPI + Strawberry GraphQL + MongoDB (Beanie)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "arq>=0.25.0",  # 0.26+ caps redis below 6, and this project needs redis 8; stay on 0.25
    "beanie>=2.2.0",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "redis>=8.1.0",
    "sentry-sdk[fastapi]>=2.75.0",
    "strawberry-graphql>=0.341.2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.17",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# GraphQL query strings and sample data read better on one line.
"tests/*.py" = ["E501"]
"scripts/*.py" = ["E501"]
# Translated email sentences read better on one line.
"app/core/email_text.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy", "strawberry.ext.mypy_plugin"]

[[tool.mypy.overrides]]
# @strawberry.field(...) with arguments is not typed for mypy; the resolvers themselves are fully annotated.
module = "app.api.graphql.*"
disable_error_code = ["untyped-decorator"]

# Architecture rules, checked in CI with `uv run lint-imports`.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api -> services -> repositories -> db -> models -> core"
type = "layers"
layers = ["app.main | app.worker", "app.api", "app.services", "app.repositories", "app.db", "app.models", "app.core"]

[[tool.importlinter.contracts]]
name = "The API layer never touches the database directly"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.repositories", "app.db", "beanie", "pymongo", "redis"]
# Going through app.services (which uses the database) is the intended path.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Business rules do not depend on the web framework"
type = "forbidden"
source_modules = ["app.services", "app.repositories", "app.db", "app.models", "app.core"]
forbidden_modules = ["fastapi", "starlette", "strawberry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
