<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ConferenceHub</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- square full-bleed background: Gmail/Google crops it to a circle -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6"/>

  <g transform="translate(0 28)">
    <!-- orbit through the attendees -->
    <circle cx="256" cy="262" r="124" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="5"/>

    <!-- spokes: hub to attendees -->
    <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="11" stroke-linecap="round">
      <line x1="256" y1="262" x2="256" y2="172"/>
      <line x1="256" y1="262" x2="178" y2="307"/>
      <line x1="256" y1="262" x2="334" y2="307"/>
    </g>

    <!-- attendees -->
    <g fill="#ffffff">
      <circle cx="256" cy="112" r="25"/>
      <path d="M214 178 a42 38 0 0 1 84 0 v2 q0 10 -10 10 h-64 q-10 0 -10 -10 z"/>
      <circle cx="148" cy="296" r="25"/>
      <path d="M106 362 a42 38 0 0 1 84 0 v2 q0 10 -10 10 h-64 q-10 0 -10 -10 z"/>
      <circle cx="364" cy="296" r="25"/>
      <path d="M322 362 a42 38 0 0 1 84 0 v2 q0 10 -10 10 h-64 q-10 0 -10 -10 z"/>
    </g>

    <!-- hub -->
    <circle cx="256" cy="262" r="44" fill="#ffffff"/>
    <circle cx="256" cy="262" r="27" fill="url(#core)"/>
    <circle cx="256" cy="262" r="10" fill="#ffffff"/>
  </g>
</svg>
