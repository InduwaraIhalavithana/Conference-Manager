<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Reset Your Password</title></head>
<body style="font-family:sans-serif;background:#f4f4f4;padding:24px">
<div style="max-width:600px;margin:0 auto;background:#fff;border-radius:8px;overflow:hidden">
  <div style="background:#6366f1;padding:32px;text-align:center">
    <h1 style="color:#fff;margin:0">Reset Your Password</h1>
  </div>
  <div style="padding:32px">
    <p>Hello,</p>
    <p>You requested a password reset for your ConferenceHub account. Click the button below to set a new password.</p>
    <div style="text-align:center;margin:32px 0">
      <a href="{{ reset_url }}" style="background:#6366f1;color:#fff;padding:14px 28px;border-radius:6px;text-decoration:none;font-weight:600">
        Reset Password
      </a>
    </div>
    <p style="color:#888;font-size:0.875rem">This link expires in 2 hours. If you did not request a password reset, you can safely ignore this email.</p>
    <p style="color:#888;font-size:0.875rem;margin-top:32px">— The ConferenceHub Team</p>
  </div>
</div>
</body>
</html>
