name: CI

on:
  push:
    branches: [master, main, v3]
  pull_request:
    branches: [master, main, v3]

jobs:
  backend:
    name: Backend (ruff + pytest + migrations)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: conference_db_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-test-secret-key-32-chars-long!!
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/conference_db_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests scripts

      - name: Migrations apply cleanly on PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade 0005
          alembic upgrade head

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (eslint + tsc + vitest + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Production build
        run: npm run build

  # ── v3 (api/ and web/) ────────────────────────────────────────────────────
  api:
    name: v3 API (ruff + mypy + architecture + audit + pytest)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      # A single-node replica set, so MongoDB transactions work like in production.
      - name: Start MongoDB 7
        working-directory: .
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok" && break
            sleep 2
          done
          for i in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'rs.status().myState')" = "1" ] && exit 0
            sleep 2
          done
          exit 1

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app scripts tests

      - name: Architecture rules (import-linter)
        run: uv run lint-imports

      - name: GraphQL schema file is up to date
        run: uv run python -m scripts.export_schema --check

      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements.txt -o /tmp/requirements.txt
          uv run pip-audit --strict --progress-spinner off -r /tmp/requirements.txt

      - name: Pytest
        run: uv run pytest -q

  web:
    name: v3 Web (eslint + tsc + vitest + audit + next build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated GraphQL types are up to date
        run: |
          npm run codegen
          git diff --exit-code -- src/graphql/generated

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Vitest (translations, formatting)
        run: npm test

      - name: Dependency audit (runtime packages)
        run: npm audit --omit=dev

      - name: Production build
        run: npm run build

  e2e:
    name: v3 End-to-end (Playwright + axe + Lighthouse)
    runs-on: ubuntu-latest
    needs: [api, web]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-e2e-secret-key-that-is-long-enough-123
      EMAIL_DELIVERY: log
      API_URL: http://127.0.0.1:8003
      SITE_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB 7 (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok" && break
            sleep 2
          done
          for i in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'rs.status().myState')" = "1" ] && exit 0
            sleep 2
          done
          exit 1

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Start the API with sample data
        working-directory: api
        run: |
          uv sync --locked
          uv run python -m scripts.seed_spike
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8003 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8003/health && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and start the web app
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm start > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/en > /dev/null && exit 0; sleep 1; done
          cat /tmp/web.log; exit 1

      - name: Playwright
        working-directory: web
        run: npm run e2e

      # Desktop Lighthouse, 3 runs per page; every category's median must reach 90 (accessibility 95).
      - name: Lighthouse
        working-directory: web
        run: npx -y @lhci/cli@0.14.0 autorun

      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            web/lighthouse-reports
            web/.lighthouseci
          include-hidden-files: true
          retention-days: 14

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      - name: Server logs
        if: failure()
        run: |
          tail -n 100 /tmp/api.log || true
          tail -n 100 /tmp/web.log || true
