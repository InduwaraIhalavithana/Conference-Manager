  retryAfterSeconds: Int
  remainingAttempts: Int
}

type Venue {
  name: String
  address: String
  city: String
  location: GeoLocation
}

"""Whoever is signed in."""
union Viewer = Organizer | Admin

"""The conference is full; this person is on the waitlist."""
type Waitlisted {
  ticketCode: String!
  position: Int!
}
