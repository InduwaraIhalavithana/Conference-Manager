<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Admin Reply to Your Feedback</title></head>
<body style="font-family:sans-serif;background:#f4f4f4;padding:24px">
<div style="max-width:600px;margin:0 auto;background:#fff;border-radius:8px;overflow:hidden">
  <div style="background:#6366f1;padding:32px;text-align:center">
    <h1 style="color:#fff;margin:0">Reply to Your Feedback</h1>
  </div>
  <div style="padding:32px">
    <p>Hello <strong>{{ organizer_name }}</strong>,</p>
    <p>The admin has replied to your feedback:</p>
    <div style="background:#f5f5f5;border-left:4px solid #888;padding:16px;border-radius:4px;margin:8px 0">
      <p style="margin:0;color:#555;font-style:italic">{{ feedback_subject }}</p>
    </div>
    <div style="background:#f0f0ff;border-left:4px solid #6366f1;padding:16px;border-radius:4px;margin:16px 0">
      <p style="margin:0;color:#1e1b4b">{{ reply }}</p>
    </div>
    <p style="color:#888;font-size:0.875rem;margin-top:32px">— The ConferenceHub Admin Team</p>
  </div>
</div>
</body>
</html>
